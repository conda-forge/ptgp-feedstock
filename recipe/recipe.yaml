schema_version: 1

context:
  version: "0.1.2"
  python_min: "3.12"

package:
  name: ptgp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ptgp/ptgp-${{ version }}.tar.gz
  sha256: 47193b3745568e8d1260e2cf890c88e8693ca64c40529a04aa560b94b3c3a1ee

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pymc >=6.2.0,<6.3
    - pytensor >=3.2.3,<3.3

tests:
  - python:
      imports:
        - ptgp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A practitioner's toolbox for estimating large-scale Gaussian Process models with PyMC and PyTensor
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/ptgp/

extra:
  recipe-maintainers:
    - bwengals
    - jessegrabowski
    - maresb
    - ricardoV94
