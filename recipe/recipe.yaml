schema_version: 1

context:
  version: "0.3.0"
  python_min: "3.12"

package:
  name: ptgp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ptgp/ptgp-${{ version }}.tar.gz
  sha256: fd954091b2779d2a60096513d693be6625c1adda8597c2d502433ec4f5acaf3d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pymc >=6.3,<6.4
    - pytensor >=3.3.8,<3.4
    - pytensor-ml >=0.4.0,<0.5.0

tests:
  - python:
      imports:
        - ptgp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A practitioner's toolbox for estimating large-scale Gaussian Process models with PyMC and PyTensor
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/ptgp/

extra:
  recipe-maintainers:
    - bwengals
    - jessegrabowski
    - maresb
    - ricardoV94
