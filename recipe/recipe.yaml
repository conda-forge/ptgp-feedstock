schema_version: 1

context:
  version: "0.2.0"
  python_min: "3.12"

package:
  name: ptgp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/ptgp/ptgp-${{ version }}.tar.gz
  sha256: 05d740213b66ecb49c6038e0ae369267b0d8f260af64d58a3b7eb552f94055f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pymc >=6.3,<6.4
    - pytensor >=3.3,<3.4

tests:
  - python:
      imports:
        - ptgp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A practitioner's toolbox for estimating large-scale Gaussian Process models with PyMC and PyTensor
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/ptgp/

extra:
  recipe-maintainers:
    - bwengals
    - jessegrabowski
    - maresb
    - ricardoV94
